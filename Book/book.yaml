title: "Book-forge로 읽는 AI 에이전트와 Harness Engineering"
language: ko

# 챕터 순서: Part_로마숫자_/Chapter_NN_ 명명규칙이 book-binder 2순위 자동감지와
# 일치해 Part I~IV 챕터(신설 Ch10·Ch13 포함, Part III는 6개 챕터) + Appendix
# A/B/C(신설 C 포함) 순서는 자동으로 맞게 잡힌다.
# 99_맺음말.md은 앞자리 번호(99 ≥ 50 임계값)로 자동 후주 처리되어 Part IV 뒤·
# Appendix 앞에 배치된다 — build_book.py의 ORDERED_FILES와 동일.
#
# 최상위 전주(front matter)는 00_서문.md 하나뿐이다(구 00_Book_forge_둘러보기.md는
# 삭제, 내용은 1~2장과 신설 부록 C로 재배치됐다) — 자연정렬 충돌이 없다.

exclude:
  - "README.md"
  - "readme.md"
  - "book.yaml"
  # 집필 관리용 문서 — build_book.py/build_pdf_chapters.py 둘 다
  # ORDERED_FILES/EXCLUDE_STEMS에서 명시적으로 제외한다.
  - "00_기획안.md"
  - "02_목차_초안.md"

callouts:
  # 본문에서 실제로 쓰이는 TIP 콜아웃 마커만 등록 (👨‍💻 8회, 📋 7회 —
  # 📊/🔧/🚨/💡는 이 책 챕터에서 사용되지 않음).
  tip_markers:
    - "👨‍💻"  # 개발자 TIP
    - "📋"    # QA 관리자 TIP
